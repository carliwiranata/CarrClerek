name: Build CarrClerek APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build CarrClerek APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ==========================================
      # 3. CREATE PACKAGE.JSON
      # ==========================================
      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      # ==========================================
      # 4. INSTALL TYPESCRIPT
      # ==========================================
      - name: Install TypeScript
        run: |
          npm install --save-dev typescript

      # ==========================================
      # 5. INSTALL CAPACITOR
      # ==========================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.4
          npm install --save-dev @capacitor/cli@7.4.4

      # ==========================================
      # 6. INSTALL CAPACITOR ANDROID
      # ==========================================
      - name: Install Capacitor Android
        run: |
          npm install @capacitor/android@7.4.4

      # ==========================================
      # 7. PREPARE WEB FILES
      # ==========================================
      - name: Prepare Web Files
        run: |
          rm -rf www
          mkdir -p www

          rsync -av \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='www' \
            --exclude='.git' \
            --exclude='.github' \
            ./ www/

          echo "Isi folder www:"
          find www -maxdepth 2 -type f | sort

      # ==========================================
      # 8. CREATE CAPACITOR CONFIG
      # ==========================================
      - name: Create Capacitor Configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.carrclerek.app',
            appName: 'CarrClerek',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

          echo "Capacitor config:"
          cat capacitor.config.ts

      # ==========================================
      # 9. ADD ANDROID PLATFORM
      # ==========================================
      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Folder android sudah ada, dilewati."
          fi

      # ==========================================
      # 10. SYNC ANDROID
      # ==========================================
      - name: Sync Android
        run: |
          npx cap sync android

      # ==========================================
      # 11. SETUP JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 12. CHECK JAVA & GRADLE
      # ==========================================
      - name: Check Build Environment
        run: |
          java -version
          cd android
          chmod +x gradlew
          ./gradlew --version

      # ==========================================
      # 13. BUILD DEBUG APK
      # ==========================================
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # ==========================================
      # 14. CHECK APK
      # ==========================================
      - name: Prepare APK
        run: |
          mkdir -p output

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/CarrClerek-debug.apk

          echo "APK berhasil dibuat:"
          ls -lh output/CarrClerek-debug.apk

      # ==========================================
      # 15. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarrClerek-APK
          path: output/CarrClerek-debug.apk
          if-no-files-found: error
          retention-days: 30
