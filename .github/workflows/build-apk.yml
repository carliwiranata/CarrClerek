name: Build CarrClerek APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build CarrClerek APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # 3. SETUP JAVA 21
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================
      # 4. CHECK JAVA
      # ==========================================
      - name: Check Java
        run: |
          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version

      # ==========================================
      # 5. CREATE PACKAGE.JSON
      # ==========================================
      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          echo "package.json:"
          cat package.json

      # ==========================================
      # 6. INSTALL CAPACITOR
      # ==========================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.4
          npm install --save-dev @capacitor/cli@7.4.4

      # ==========================================
      # 7. INSTALL CAPACITOR ANDROID
      # ==========================================
      - name: Install Capacitor Android
        run: |
          npm install @capacitor/android@7.4.4

      # ==========================================
      # 8. PREPARE WEB FILES
      # ==========================================
      - name: Prepare Web Files
        run: |
          rm -rf www
          mkdir -p www

          rsync -av \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='www' \
            --exclude='.git' \
            --exclude='.github' \
            ./ www/

          echo ""
          echo "=========================================="
          echo "ISI FOLDER WWW"
          echo "=========================================="

          find www -maxdepth 2 -type f | sort

      # ==========================================
      # 9. CHECK INDEX.HTML
      # ==========================================
      - name: Check Web App
        run: |
          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html tidak ditemukan!"
            echo ""
            echo "File yang tersedia:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "index.html ditemukan:"
          ls -lh www/index.html

      # ==========================================
      # 10. REMOVE OLD CAPACITOR CONFIG
      # ==========================================
      - name: Remove Old Capacitor Config
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.mjs

      # ==========================================
      # 11. CREATE CAPACITOR CONFIGURATION
      # ==========================================
      - name: Create Capacitor Configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.carrclerek.app",
            "appName": "CarrClerek",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          echo ""
          echo "=========================================="
          echo "CAPACITOR CONFIG"
          echo "=========================================="

          cat capacitor.config.json

      # ==========================================
      # 12. ADD ANDROID PLATFORM
      # ==========================================
      - name: Add Android Platform
        run: |
          npx cap add android

      # ==========================================
      # 13. SYNC ANDROID
      # ==========================================
      - name: Sync Android
        run: |
          npx cap sync android

      # ==========================================
      # 14. CHECK BUILD ENVIRONMENT
      # ==========================================
      - name: Check Build Environment
        run: |
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "NODE"
          echo "=========================================="

          node --version

          echo ""
          echo "=========================================="
          echo "NPM"
          echo "=========================================="

          npm --version

          echo ""
          echo "=========================================="
          echo "CAPACITOR"
          echo "=========================================="

          npx cap --version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          cd android
          chmod +x gradlew
          ./gradlew --version

      # ==========================================
      # 15. BUILD DEBUG APK
      # ==========================================
      - name: Build APK
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      # ==========================================
      # 16. PREPARE APK
      # ==========================================
      - name: Prepare APK
        run: |
          mkdir -p output

          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK tidak ditemukan!"

            echo ""
            echo "File hasil build:"
            find android/app/build/outputs -type f 2>/dev/null || true

            exit 1
          fi

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/CarrClerek-debug.apk

          echo ""
          echo "=========================================="
          echo "APK BERHASIL DIBUAT"
          echo "=========================================="

          ls -lh output/CarrClerek-debug.apk

      # ==========================================
      # 17. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarrClerek-APK
          path: output/CarrClerek-debug.apk
          if-no-files-found: error
          retention-days: 30
