                if(!p||typeof p.openFTAnswer!=='function'){alert('Jawaban FT belum tersedia. Perbarui aplikasi CarrClerek.');return;}
                try{await verifyAndRunFeature('Jawaban FT',null,function(){return p.openFTAnswer();});}
                catch(e){alert(e&&e.message?e.message:'Jawaban FT gagal dibuka.');}
              });
              document.querySelectorAll('#strukTrakerNativeCard,#stockSTShiftNativeCard').forEach(function(x){x.hidden=true;});
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install);
            else install();
            var mo=new MutationObserver(install);
            mo.observe(document.documentElement,{childList:true,subtree:true});
            setTimeout(install,500);
            setTimeout(install,1500);
          })();
          </script>
          """
              pos = html.lower().rfind("</body>")
              if pos >= 0:
                  html = html[:pos] + script + "\n" + html[pos:]
              else:
                  html += script
              index.write_text(html, encoding="utf-8")
          PY

          echo "=== STRUKTRAKER NATIVE FILES ==="
          ls -l "$SRC/StrukTrakerPlugin.java" "$SRC/StrukTrakerActivity.java"
          grep -n "StrukTrakerActivity" android/app/src/main/AndroidManifest.xml
          grep -n "CARRCLEREK_STRUKTRAKER_NATIVE_ENTRY" www/index.html

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Verify Android Settings
        run: |
          echo "=== LOCATION ==="
          grep -n "ACCESS_.*LOCATION" \
            android/app/src/main/AndroidManifest.xml

          echo "=== ICON ==="
          grep -n 'android:icon\|android:roundIcon' \
            android/app/src/main/AndroidManifest.xml

          echo "=== ANTI SCREENSHOT ==="
          grep -n "FLAG_SECURE" \
            android/app/src/main/java/com/carrclerek/app/MainActivity.java

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          cp "$APK" \
            output/CarrClerek-AyamPanggangLAVA-debug.apk

          ls -lh output/CarrClerek-AyamPanggangLAVA-debug.apk

      # ==========================================================
      # PUBLISH WEB LAYER OTA BUNDLE TO SUPABASE STORAGE
      # Required GitHub Actions secrets:
      # SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY
      # ==========================================================
      - name: Publish CarrClerek Live Update to Supabase
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          BUCKET="carrclerek-updates"
          BUNDLE_ID="${GITHUB_SHA}"
          mkdir -p output
          (cd www && zip -qr "../output/carrclerek-web-${BUNDLE_ID}.zip" .)
          ZIP="output/carrclerek-web-${BUNDLE_ID}.zip"
          CHECKSUM="$(sha256sum "$ZIP" | awk '{print $1}')"

          # Create a public-read bucket if it does not exist yet.
          curl -sS -o /tmp/create-bucket.json -w "%{http_code}" \
            -X POST "${SUPABASE_URL%/}/storage/v1/bucket" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$BUCKET\",\"name\":\"$BUCKET\",\"public\":true}" > /tmp/bucket-status.txt
          STATUS="$(cat /tmp/bucket-status.txt)"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ] && [ "$STATUS" != "409" ]; then
            cat /tmp/create-bucket.json
            echo "Gagal menyiapkan bucket Supabase (HTTP $STATUS)."
            exit 1
          fi

          curl -fsS -X POST \
            "${SUPABASE_URL%/}/storage/v1/object/$BUCKET/bundles/$BUNDLE_ID.zip" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/zip" \
            -H "x-upsert: true" \
            --data-binary "@$ZIP" > /tmp/ota-upload.json

          BUNDLE_URL="${SUPABASE_URL%/}/storage/v1/object/public/$BUCKET/bundles/$BUNDLE_ID.zip"
          printf '{"bundleId":"%s","version":"%s","url":"%s","checksum":"%s","nativeMinVersionCode":1}\n' \
            "$BUNDLE_ID" "$GITHUB_SHA" "$BUNDLE_URL" "$CHECKSUM" > output/latest.json

          curl -fsS -X POST \
            "${SUPABASE_URL%/}/storage/v1/object/$BUCKET/latest.json" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary "@output/latest.json" > /tmp/ota-manifest-upload.json

          echo "Live Update berhasil dipublikasikan: $BUNDLE_ID"
          echo "Manifest: ${SUPABASE_URL%/}/storage/v1/object/public/$BUCKET/latest.json"

      - name: Explain Missing Supabase OTA Secrets
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "::warning::OTA belum dipublikasikan. Tambahkan GitHub Actions secrets SUPABASE_URL dan SUPABASE_SERVICE_ROLE_KEY agar bundle otomatis dikirim ke Supabase Storage."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarrClerek-APK-AyamPanggangLAVA
          path: output/CarrClerek-AyamPanggangLAVA-debug.apk
          if-no-files-found: error
          retention-days: 30
