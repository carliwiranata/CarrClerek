name: Build CarrClerek APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build CarrClerek APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # 3. JAVA 21
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================
      # 4. CHECK JAVA
      # ==========================================
      - name: Check Java
        run: |
          java -version
          node --version
          npm --version

      # ==========================================
      # 5. CREATE PACKAGE.JSON
      # ==========================================
      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          cat package.json

      # ==========================================
      # 6. INSTALL CAPACITOR
      # ==========================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.4
          npm install --save-dev @capacitor/cli@7.4.4

      # ==========================================
      # 7. INSTALL CAPACITOR ANDROID
      # ==========================================
      - name: Install Capacitor Android
        run: |
          npm install @capacitor/android@7.4.4

      # ==========================================
      # 8. PREPARE WEB FILES
      # ==========================================
      - name: Prepare Web Files
        run: |
          rm -rf www
          mkdir -p www

          rsync -av \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='www' \
            --exclude='.git' \
            --exclude='.github' \
            ./ www/

          echo "=========================================="
          echo "WEB FILES"
          echo "=========================================="

          find www -maxdepth 2 -type f | sort

      # ==========================================
      # 9. CHECK INDEX.HTML
      # ==========================================
      - name: Check Web App
        run: |
          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html tidak ditemukan!"
            exit 1
          fi

          echo "index.html ditemukan."
          ls -lh www/index.html

      # ==========================================
      # 10. REMOVE OLD CONFIG
      # ==========================================
      - name: Remove Old Capacitor Config
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.mjs

      # ==========================================
      # 11. CAPACITOR CONFIG
      # ==========================================
      - name: Create Capacitor Configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.carrclerek.app",
            "appName": "CarrClerek",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          cat capacitor.config.json

      # ==========================================
      # 12. ADD ANDROID
      # ==========================================
      - name: Add Android Platform
        run: |
          npx cap add android

      # ==========================================
      # 13. ADD LOCATION PERMISSION
      # ==========================================
      - name: Add Android Location Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "=========================================="
          echo "MENAMBAHKAN PERMISSION LOKASI"
          echo "=========================================="

          if ! grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
          fi

          if ! grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
          fi

          echo ""
          echo "Isi AndroidManifest.xml:"
          cat "$MANIFEST"

      # ==========================================
      # 14. SYNC ANDROID
      # ==========================================
      - name: Sync Android
        run: |
          npx cap sync android

      # ==========================================
      # 15. VERIFY LOCATION PERMISSION
      # ==========================================
      - name: Verify Location Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "=========================================="
          echo "CEK PERMISSION LOKASI"
          echo "=========================================="

          grep -n "ACCESS_COARSE_LOCATION" "$MANIFEST"
          grep -n "ACCESS_FINE_LOCATION" "$MANIFEST"

          echo ""
          echo "Permission lokasi berhasil dipasang."

      # ==========================================
      # 16. CHECK CAPACITOR
      # ==========================================
      - name: Check Capacitor
        run: |
          npx cap --version

      # ==========================================
      # 17. CHECK GRADLE
      # ==========================================
      - name: Check Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --version

      # ==========================================
      # 18. BUILD APK
      # ==========================================
      - name: Build APK
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      # ==========================================
      # 19. PREPARE APK
      # ==========================================
      - name: Prepare APK
        run: |
          mkdir -p output

          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK tidak ditemukan!"
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          cp android/app/build/outputs/apk/debug/app-debug.apk \
            output/CarrClerek-debug.apk

          echo "=========================================="
          echo "APK BERHASIL DIBUAT"
          echo "=========================================="

          ls -lh output/CarrClerek-debug.apk

      # ==========================================
      # 20. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarrClerek-APK-Lokasi
          path: output/CarrClerek-debug.apk
          if-no-files-found: error
          retention-days: 30
