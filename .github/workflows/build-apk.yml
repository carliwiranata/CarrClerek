                                  + "function allFields(){var out=[];roots(document).forEach(function(d){try{out=out.concat([].slice.call(d.querySelectorAll('input:not([type=hidden]),textarea')));}catch(ignore){}});return out;}"
                                  + "function fieldLabel(x){var parts=[x.placeholder,x.name,x.id,x.getAttribute('aria-label'),x.getAttribute('title')];if(x.id){var l=document.querySelector('label[for=\\\"'+CSS.escape(x.id)+'\\\"]');if(l)parts.push(l.innerText);}"
                                  + "var p=x;for(var i=0;p&&i<5;i++,p=p.parentElement){parts.push(p.innerText||p.textContent||'');}return parts.join(' ').replace(/\\s+/g,' ').toLowerCase();}"
