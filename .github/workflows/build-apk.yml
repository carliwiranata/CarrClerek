name: Build CarrClerek APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build CarrClerek APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Environment
        run: |
          java -version
          node --version
          npm --version

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.4
          npm install --save-dev @capacitor/cli@7.4.4
          npm install @capacitor/android@7.4.4

      - name: Prepare Web Files
        run: |
          rm -rf www
          mkdir -p www

          rsync -av \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='www' \
            --exclude='.git' \
            --exclude='.github' \
            ./ www/

          test -f www/index.html

      - name: Create Capacitor Configuration
        run: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.mjs

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.carrclerek.app",
            "appName": "CarrClerek",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android

      # ==========================================================
      # LOCATION PERMISSION
      # ==========================================================
      - name: Add Android Location Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          ]

          for p in permissions:
              if p not in content:
                  content = content.replace("</manifest>", p + "\n</manifest>")

          path.write_text(content, encoding="utf-8")
          PY

      # ==========================================================
      # APP ICON - AYAM PANGGANG LAVA
      # ==========================================================
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install Lava App Icon
        run: |
          set -e

          SRC="assets/app-icon.png"
          RES="android/app/src/main/res"

          test -f "$SRC"

          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$D"
          done

          # Use a unique resource name so Android/launcher cache
          # cannot keep using the old ic_launcher resource.
          convert "$SRC" -resize 48x48   "$RES/mipmap-mdpi/ic_launcher_lava.png"
          convert "$SRC" -resize 72x72   "$RES/mipmap-hdpi/ic_launcher_lava.png"
          convert "$SRC" -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher_lava.png"
          convert "$SRC" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher_lava.png"
          convert "$SRC" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_lava.png"

          # Round icon uses the same artwork.
          convert "$SRC" -resize 48x48   "$RES/mipmap-mdpi/ic_launcher_lava_round.png"
          convert "$SRC" -resize 72x72   "$RES/mipmap-hdpi/ic_launcher_lava_round.png"
          convert "$SRC" -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher_lava_round.png"
          convert "$SRC" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher_lava_round.png"
          convert "$SRC" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_lava_round.png"

          # Explicitly point AndroidManifest to the NEW icon name.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8")

          content = content.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher_lava"'
          )
          content = content.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@mipmap/ic_launcher_lava_round"'
          )

          path.write_text(content, encoding="utf-8")
          PY

          echo "=== ICON RESOURCES ==="
          find "$RES" -name 'ic_launcher_lava*' -type f | sort

          echo "=== MANIFEST ICON ==="
          grep -n 'android:icon\|android:roundIcon' \
            android/app/src/main/AndroidManifest.xml

      # ==========================================================
      # ANTI SCREENSHOT / SCREEN RECORDING
      # ==========================================================
      - name: Enable Anti Screenshot
        run: |
          MAIN="android/app/src/main/java/com/carrclerek/app/MainActivity.java"

          mkdir -p "$(dirname "$MAIN")"

          cat > "$MAIN" <<'EOF'
          package com.carrclerek.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StrukTrakerPlugin.class);
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );
              }
          }
          EOF

          grep -n "FLAG_SECURE" "$MAIN"

      # ==========================================================
      # STRUKTRAKER - PRIVATE IN-APP WEBVIEW
      # ==========================================================
      - name: Install StrukTraker WebView
        run: |
          set -e
          SRC="android/app/src/main/java/com/carrclerek/app"
          mkdir -p "$SRC"

          cat > "$SRC/StrukTrakerPlugin.java" <<'EOF'
          package com.carrclerek.app;

          import android.content.Intent;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "StrukTraker")
          public class StrukTrakerPlugin extends Plugin {
              @PluginMethod
              public void open(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      getActivity().startActivity(
                          new Intent(getActivity(), StrukTrakerActivity.class)
                      );
                      call.resolve();
                  });
              }

              @PluginMethod
              public void openStockSTShift(PluginCall call) {
                  String storeCode = call.getString("storeCode", "").trim();
                  if (!storeCode.matches("[A-Za-z0-9_-]{1,20}")) {
                      call.reject("Kode toko tidak valid atau belum diatur.");
                      return;
                  }
                  Intent intent = new Intent(getActivity(), StrukTrakerActivity.class);
                  intent.putExtra("stock_store_code", storeCode);
                  getActivity().runOnUiThread(() -> {
                      getActivity().startActivity(intent);
                      call.resolve();
                  });
              }
          }
          EOF

          cat > "$SRC/StrukTrakerActivity.java" <<'EOF'
          package com.carrclerek.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.webkit.ValueCallback;

          public class StrukTrakerActivity extends Activity {
              private static final String STRUKTRAKER_URL = "https://struktraker.lovable.app/";
              private static final String STOCK_ST_SHIFT_URL = "https://kalkulatorsaya.my.id/Catur/scan_serah_terima.html?toko=";
              private static final int FILE_CHOOSER_REQUEST = 7412;
              private WebView webView;
              private ProgressBar progress;
              private ValueCallback<Uri[]> filePathCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,
                                       WindowManager.LayoutParams.FLAG_SECURE);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(18, 18, 20));

                  LinearLayout bar = new LinearLayout(this);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(14, 8, 14, 8);
                  bar.setBackgroundColor(Color.rgb(25, 25, 28));

                  Button back = new Button(this);
                  back.setText("‹");
                  back.setTextSize(25);
                  back.setTextColor(Color.WHITE);
                  back.setBackgroundColor(Color.TRANSPARENT);
                  back.setOnClickListener(v -> finish());

                  TextView title = new TextView(this);
                  String stockStoreCode = getIntent().getStringExtra("stock_store_code");
                  boolean stockMode = stockStoreCode != null && !stockStoreCode.trim().isEmpty();
                  title.setText(stockMode ? "Stock ST Shift • " + stockStoreCode : "StrukTraker");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(18);
                  title.setGravity(Gravity.CENTER_VERTICAL);
                  title.setPadding(12, 0, 0, 0);
                  title.setTypeface(null, android.graphics.Typeface.BOLD);

                  bar.addView(back, new LinearLayout.LayoutParams(52, 52));
                  bar.addView(title, new LinearLayout.LayoutParams(0, 52, 1));
                  root.addView(bar);

                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  root.addView(progress, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 3));

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  android.webkit.CookieManager cookies = android.webkit.CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String host = uri.getHost();
                          boolean allowedHost = host != null &&
                              ("struktraker.lovable.app".equalsIgnoreCase(host) ||
                               "kalkulatorsaya.my.id".equalsIgnoreCase(host));
                          if ("https".equalsIgnoreCase(uri.getScheme()) && allowedHost) {
                              return false;
                          }
                          Toast.makeText(StrukTrakerActivity.this,
                              "Tautan di luar StrukTraker dibatasi.", Toast.LENGTH_SHORT).show();
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view,
                          android.webkit.WebResourceRequest request,
                          android.webkit.WebResourceError error) {
                          if (request.isForMainFrame()) {
                              Toast.makeText(StrukTrakerActivity.this,
                                  "StrukTraker gagal dimuat. Periksa koneksi internet.",
                                  Toast.LENGTH_LONG).show();
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int value) {
                          progress.setProgress(value);
                          progress.setVisibility(value >= 100 ? View.GONE : View.VISIBLE);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view,
                          ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          intent.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{
                              "application/zip", "application/x-zip-compressed",
                              "application/octet-stream", "application/vnd.sqlite3",
                              "application/x-sqlite3", "application/pdf", "image/*"
                          });
                          try {
                              startActivityForResult(Intent.createChooser(intent,
                                  "Pilih file database / ZIP"), FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              filePathCallback = null;
                              callback.onReceiveValue(null);
                              Toast.makeText(StrukTrakerActivity.this,
                                  "Pemilih file tidak dapat dibuka.", Toast.LENGTH_SHORT).show();
                          }
                          return true;
                      }
                  });

                  root.addView(webView, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 0, 1));
                  setContentView(root);
                  String storeCode = getIntent().getStringExtra("stock_store_code");
                  if (storeCode != null && !storeCode.trim().isEmpty()) {
                      webView.loadUrl(STOCK_ST_SHIFT_URL + Uri.encode(storeCode.trim()));
                  } else {
                      webView.loadUrl(STRUKTRAKER_URL);
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST && filePathCallback != null) {
                      Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(result);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else finish();
              }

              @Override
              protected void onDestroy() {
                  if (filePathCallback != null) {
                      filePathCallback.onReceiveValue(null);
                      filePathCallback = null;
                  }
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          activity = '        <activity android:name=".StrukTrakerActivity" android:exported="false" android:configChanges="keyboard|keyboardHidden|orientation|screenSize" />'
          if "StrukTrakerActivity" not in s:
              s = s.replace("</application>", activity + "\n    </application>")
          p.write_text(s, encoding="utf-8")

          # Menu only exists in the native Android build and only while the
          # existing CarrClerek user shell is visible after successful login.
          index = Path("www/index.html")
          html = index.read_text(encoding="utf-8")
          marker = "/* CARRCLEREK_STRUKTRAKER_NATIVE_ENTRY */"
          if marker not in html:
              script = r"""
          <script>
          /* CARRCLEREK_STRUKTRAKER_NATIVE_ENTRY */
          /* CARRCLEREK_STOCK_ST_SHIFT_NATIVE_ENTRY */
          (function(){
            'use strict';
            var storeCode = '';
            var lookupRunning = false;
            async function loadStockStoreCode(profile){
              if(!profile || !profile.store_id){ storeCode=''; return; }
              if(lookupRunning) return;
              lookupRunning = true;
              try{
                var result = await supa.from('stores').select('code').eq('id',String(profile.store_id)).maybeSingle();
                storeCode = result && result.data && result.data.code ? String(result.data.code).trim() : '';
                window.__stockSTShiftStoreCode = storeCode;
                refreshStockCard();
              }catch(e){
                console.warn('Stock ST Shift: gagal membaca kode toko',e);
                storeCode='';
              }finally{ lookupRunning=false; }
            }
            var originalShowUserApp = window.showUserApp;
            if(typeof originalShowUserApp === 'function'){
              window.showUserApp = function(profile,user){
                var result = originalShowUserApp.apply(this,arguments);
                loadStockStoreCode(profile);
                return result;
              };
            }
            function refreshStockCard(){
              var cap=window.Capacitor;
              if(!cap || typeof cap.isNativePlatform!=='function' || !cap.isNativePlatform()) return;
              var shell=document.getElementById('appShell');
              var admin=document.getElementById('adminPage');
              var login=document.getElementById('loginPage');
              var visible=!!(shell && getComputedStyle(shell).display!=='none' &&
                shell.getClientRects().length && (!admin || !admin.classList.contains('show')) &&
                (!login || !login.classList.contains('show')));
              var card=document.getElementById('stockSTShiftNativeCard');
              if(!visible){ if(card)card.remove(); return; }
              if(!storeCode){ if(card)card.remove(); return; }
              if(card && card.isConnected) return;
              card=document.createElement('section');
              card.className='card';
              card.id='stockSTShiftNativeCard';
              card.innerHTML='<div style="font-size:21px;font-weight:900;margin-bottom:7px">📦 Stock ST Shift</div>'+
                '<div class="muted" style="margin-bottom:14px">Kode toko otomatis: <b>'+storeCode.replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];})+'</b></div>'+
                '<button type="button" class="btn" id="stockSTShiftNativeOpen">BUKA STOCK ST SHIFT</button>';
              var anchor=document.getElementById('strukTrakerNativeCard')||document.getElementById('authUserBar');
              if(anchor && anchor.parentNode)anchor.parentNode.insertBefore(card,anchor.nextSibling);
              else shell.insertBefore(card,shell.firstChild);
              card.querySelector('#stockSTShiftNativeOpen').addEventListener('click',function(){
                var button=this;
                var cap=window.Capacitor;
                var plugin=cap && cap.Plugins && cap.Plugins.StrukTraker;
                if(!plugin || typeof plugin.openStockSTShift!=='function'){
                  alert('Fitur Stock ST Shift belum tersedia. Perbarui aplikasi CarrClerek.');
                  return;
                }
                button.disabled=true;button.textContent='MEMBUKA...';
                Promise.resolve(plugin.openStockSTShift({storeCode:storeCode})).catch(function(){
                  alert('Stock ST Shift gagal dibuka. Periksa koneksi dan coba lagi.');
                }).finally(function(){button.disabled=false;button.textContent='BUKA STOCK ST SHIFT';});
              });
            }
            function refresh(){refreshStockCard();}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',refresh);
            else refresh();
            new MutationObserver(refresh).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});
          })();
          (function(){
            'use strict';
            function initStrukTrakerEntry(){
              var cap = window.Capacitor;
              if(!cap || typeof cap.isNativePlatform !== 'function' || !cap.isNativePlatform()) return;
              var plugin = cap.Plugins && cap.Plugins.StrukTraker;
              if(!plugin || typeof plugin.open !== 'function') return;

              var card = null;
              function refresh(){
                var shell = document.getElementById('appShell');
                var admin = document.getElementById('adminPage');
                var login = document.getElementById('loginPage');
                var userVisible = !!(shell && getComputedStyle(shell).display !== 'none' &&
                  shell.getClientRects().length && (!admin || !admin.classList.contains('show')) &&
                  (!login || !login.classList.contains('show')));
                if(!userVisible){
                  if(card){card.remove();card=null;}
                  return;
                }
                if(card && card.isConnected) return;
                card = document.createElement('section');
                card.className = 'card';
                card.id = 'strukTrakerNativeCard';
                card.innerHTML = '<div style="font-size:21px;font-weight:900;margin-bottom:7px">🧾 StrukTraker</div>' +
                  '<div class="muted" style="margin-bottom:14px">Buka fitur rekap struk langsung di aplikasi CarrClerek.</div>' +
                  '<button type="button" class="btn" id="strukTrakerNativeOpen">BUKA STRUKTRAKER</button>';
                var anchor = document.getElementById('authUserBar');
                if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(card, anchor.nextSibling);
                else shell.insertBefore(card, shell.firstChild);
                card.querySelector('#strukTrakerNativeOpen').addEventListener('click', function(){
                  var button = this;
                  button.disabled = true;
                  button.textContent = 'MEMBUKA...';
                  Promise.resolve(plugin.open()).catch(function(){
                    alert('StrukTraker belum dapat dibuka. Tutup aplikasi lalu coba lagi.');
                  }).finally(function(){
                    button.disabled = false;
                    button.textContent = 'BUKA STRUKTRAKER';
                  });
                });
              }
              refresh();
              new MutationObserver(refresh).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});
              window.setInterval(refresh,1500);
            }
            if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded',initStrukTrakerEntry);
            else initStrukTrakerEntry();
          })();
          </script>
          """
              pos = html.lower().rfind("</body>")
              if pos >= 0:
                  html = html[:pos] + script + "\n" + html[pos:]
              else:
                  html += script
              index.write_text(html, encoding="utf-8")
          PY

          echo "=== STRUKTRAKER NATIVE FILES ==="
          ls -l "$SRC/StrukTrakerPlugin.java" "$SRC/StrukTrakerActivity.java"
          grep -n "StrukTrakerActivity" android/app/src/main/AndroidManifest.xml
          grep -n "CARRCLEREK_STRUKTRAKER_NATIVE_ENTRY" www/index.html

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Verify Android Settings
        run: |
          echo "=== LOCATION ==="
          grep -n "ACCESS_.*LOCATION" \
            android/app/src/main/AndroidManifest.xml

          echo "=== ICON ==="
          grep -n 'android:icon\|android:roundIcon' \
            android/app/src/main/AndroidManifest.xml

          echo "=== ANTI SCREENSHOT ==="
          grep -n "FLAG_SECURE" \
            android/app/src/main/java/com/carrclerek/app/MainActivity.java

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          cp "$APK" \
            output/CarrClerek-AyamPanggangLAVA-debug.apk

          ls -lh output/CarrClerek-AyamPanggangLAVA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarrClerek-APK-AyamPanggangLAVA
          path: output/CarrClerek-AyamPanggangLAVA-debug.apk
          if-no-files-found: error
          retention-days: 30
