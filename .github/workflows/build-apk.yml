                                  + "var nr=n.getBoundingClientRect();var p=n;for(var depth=0;p&&depth<7;depth++,p=p.parentElement){var fs=[].slice.call(p.querySelectorAll('input:not([type=hidden]),textarea,[role=textbox],[contenteditable=true]'));fs.forEach(function(f){var r=f.getBoundingClientRect();if(!r.width||!r.height)return;var vertical=Math.max(0,r.top-nr.bottom);var horizontal=Math.abs((r.left+r.right-nr.left-nr.right)/2);var score=vertical*10+horizontal;if(r.top>=nr.top-4&&score<bestScore){best=f;bestScore=score;}});if(best)break;}});});"
                                  + "if(best)return best;"
                                  + "x=a.find(function(e){return /masukan\\s+kode\\s+toko/.test(fieldLabel(e));});if(x)return x;"
                                  + "return null;}"
                                  + "function setNativeValue(x,v){if(x.isContentEditable||x.getAttribute('contenteditable')==='true'){x.textContent=v;return;}var w=x.ownerDocument.defaultView;var proto=x.tagName==='TEXTAREA'?w.HTMLTextAreaElement.prototype:w.HTMLInputElement.prototype;var d=Object.getOwnPropertyDescriptor(proto,'value');if(d&&d.set)d.set.call(x,v);else x.value=v;}"
                                  + "function fillStore(){var x=findStoreInput();if(!x)return false;if((x.value||x.textContent||'').trim()!==c){setNativeValue(x,c);x.dispatchEvent(new Event('input',{bubbles:true}));x.dispatchEvent(new Event('change',{bubbles:true}));}"
                                  + "x.readOnly=true;x.setAttribute('readonly','readonly');x.setAttribute('aria-readonly','true');x.setAttribute('autocomplete','off');x.style.setProperty('background','#f3f4f6','important');x.style.setProperty('cursor','not-allowed','important');"
                                  + "if(!x.dataset.carrStoreLocked){x.addEventListener('beforeinput',function(e){e.preventDefault();});x.addEventListener('keydown',function(e){if(!['Tab','Shift','ArrowLeft','ArrowRight','Home','End'].includes(e.key))e.preventDefault();});x.addEventListener('paste',function(e){e.preventDefault();});x.dataset.carrStoreLocked='1';}return true;}"
                                  + "function openStockPage(){var title=[].slice.call(document.querySelectorAll('h1,h2,h3,[role=heading]')).some(function(e){return /laporan prosentase stock opname/i.test(e.innerText||'');});if(title){window.__carrStockNavClicked=false;return;}"
                                  + "if(window.__carrStockNavClicked)return;var els=[].slice.call(document.querySelectorAll('a,button,[role=button],li,div,span'));"
                                  + "var matches=els.filter(function(e){var t=(e.innerText||e.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase();var r=e.getBoundingClientRect();return t==='stock opname'&&r.width>0&&r.height>0;});"
                                  + "matches.sort(function(a,b){return (a.innerText||a.textContent||'').length-(b.innerText||b.textContent||'').length;});var item=matches[0];if(item){var target=item;for(var i=0;i<5&&target;i++,target=target.parentElement){var role=(target.getAttribute('role')||'').toLowerCase();var tag=(target.tagName||'').toLowerCase();var cs=getComputedStyle(target);if(tag==='a'||tag==='button'||role==='button'||cs.cursor==='pointer'){item=target;break;}}window.__carrStockNavClicked=true;item.click();}}"
                                  + "function lockCloseButton(){var hs=[].slice.call(document.querySelectorAll('h1,h2,h3,[role=heading]'));var h=hs.find(function(e){return /stock\\s+opname/i.test((e.innerText||'').trim());});if(!h)return;var p=h.parentElement;for(var i=0;p&&i<3;i++,p=p.parentElement){var bs=[].slice.call(p.querySelectorAll('button,a,[role=button]'));var cs=bs.filter(function(b){var r=b.getBoundingClientRect();return r.width>0&&r.height>0&&r.right>window.innerWidth*.72&&r.top<window.innerHeight*.25;});if(cs.length){var x=cs.sort(function(a,b){return b.getBoundingClientRect().right-a.getBoundingClientRect().right;})[0];x.style.setProperty('display','none','important');x.setAttribute('aria-hidden','true');x.setAttribute('tabindex','-1');break;}}}"
