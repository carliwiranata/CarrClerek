name: Build CarrClerek APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build CarrClerek APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web Files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          if [ -d assets ]; then
            cp -r assets www/
          fi

          if [ -d supabase ]; then
            cp -r supabase www/
          fi

          if [ -f jszip.min.js ]; then
            cp jszip.min.js www/
          fi

      - name: Create Capacitor Configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.carliwiranata.carrclerek',
            appName: 'CarrClerek',
            webDir: 'www',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/CarrClerek.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarrClerek-APK
          path: apk/CarrClerek.apk
          retention-days: 30
