name: Build CarrClerek APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build CarrClerek APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Environment
        run: |
          java -version
          node --version
          npm --version

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.4
          npm install --save-dev @capacitor/cli@7.4.4
          npm install @capacitor/android@7.4.4

      - name: Install Live Update SDK
        run: |
          npm install @capawesome/capacitor-live-update@v7-lts
          npm install --save-dev esbuild

      - name: Prepare Web Files
        run: |
          rm -rf www
          mkdir -p www

          rsync -av \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='www' \
            --exclude='.git' \
            --exclude='.github' \
            ./ www/

          test -f www/index.html

      # ==========================================================
      # SELF-HOSTED OTA LIVE UPDATE (SUPABASE STORAGE)
      # ==========================================================
      - name: Prepare Live Update Client
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -e
          cat > live-update-entry.js <<'EOF'
          import { LiveUpdate } from '@capawesome/capacitor-live-update';

          const MANIFEST_URL = __OTA_MANIFEST_URL__;

          (function () {
            if (!window.Capacitor || !window.Capacitor.isNativePlatform ||
                !window.Capacitor.isNativePlatform()) return;

            let started = false;
            async function startCarrClerekLiveUpdate() {
              if (started) return;
              started = true;
              try {
                // Mark this bundle healthy before attempting another update.
                await LiveUpdate.ready();
                if (!MANIFEST_URL) return;

                const response = await fetch(MANIFEST_URL + (MANIFEST_URL.includes('?') ? '&' : '?') +
                  't=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) return;

                const release = await response.json();
                if (!release || !release.bundleId || !release.url || !release.checksum) return;

                const nativeVersion = await LiveUpdate.getVersionCode();
                if (release.nativeMinVersionCode &&
                    Number(nativeVersion.versionCode) < Number(release.nativeMinVersionCode)) return;
                if (release.nativeMaxVersionCode &&
                    Number(nativeVersion.versionCode) > Number(release.nativeMaxVersionCode)) return;

                const current = await LiveUpdate.getCurrentBundle();
                const next = await LiveUpdate.getNextBundle();
                if (current.bundleId === release.bundleId || next.bundleId === release.bundleId) return;

                await LiveUpdate.downloadBundle({
                  bundleId: String(release.bundleId),
                  url: String(release.url),
                  checksum: String(release.checksum)
                });
                await LiveUpdate.setNextBundle({ bundleId: String(release.bundleId) });

                // The downloaded update is activated safely on the next app launch.
                window.dispatchEvent(new CustomEvent('carrclerek:live-update-ready', {
                  detail: { bundleId: release.bundleId, version: release.version || '' }
                }));
                console.info('[CarrClerek OTA] Update siap diterapkan saat aplikasi dibuka kembali.');
              } catch (error) {
                console.warn('[CarrClerek OTA] Pemeriksaan update dilewati:', error);
              }
            }

            if (document.readyState === 'complete') {
              startCarrClerekLiveUpdate();
            } else {
              window.addEventListener('load', startCarrClerekLiveUpdate, { once: true });
            }
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') startCarrClerekLiveUpdate();
            });
          })();
          EOF

          OTA_MANIFEST_URL=""
          if [ -n "$SUPABASE_URL" ]; then
            OTA_MANIFEST_URL="${SUPABASE_URL%/}/storage/v1/object/public/carrclerek-updates/latest.json"
          fi

          npx esbuild live-update-entry.js --bundle --format=iife --target=es2020 \
            --outfile=www/carrclerek-live-update.js \
            --define:__OTA_MANIFEST_URL__="'${OTA_MANIFEST_URL}'"

          python3 - <<'PY'
          from pathlib import Path
          index = Path("www/index.html")
          html = index.read_text(encoding="utf-8")
          tag = '<script src="carrclerek-live-update.js"></script>'
          if tag not in html:
              pos = html.lower().rfind("</body>")
              if pos >= 0:
                  html = html[:pos] + tag + "\\n" + html[pos:]
              else:
                  html += tag
              index.write_text(html, encoding="utf-8")
          PY

      - name: Create Capacitor Configuration
        run: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.mjs

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.carrclerek.app",
            "appName": "CarrClerek",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Configure Live Update Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path("capacitor.config.json")
          cfg = json.loads(p.read_text(encoding="utf-8"))
          cfg.setdefault("plugins", {})["LiveUpdate"] = {
              "autoBlockRolledBackBundles": True,
              "readyTimeout": 10000
          }
          p.write_text(json.dumps(cfg, indent=2), encoding="utf-8")
          PY

      # ==========================================================
      # LOCATION PERMISSION
      # ==========================================================
      - name: Add Android Location Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          ]

          for p in permissions:
              if p not in content:
                  content = content.replace("</manifest>", p + "\n</manifest>")

          path.write_text(content, encoding="utf-8")
          PY

      # ==========================================================
      # APP ICON - AYAM PANGGANG LAVA
      # ==========================================================
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install Lava App Icon
        run: |
          set -e

          SRC="assets/app-icon.png"
          RES="android/app/src/main/res"

          test -f "$SRC"

          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$D"
          done

          # Use a unique resource name so Android/launcher cache
          # cannot keep using the old ic_launcher resource.
          convert "$SRC" -resize 48x48   "$RES/mipmap-mdpi/ic_launcher_lava.png"
          convert "$SRC" -resize 72x72   "$RES/mipmap-hdpi/ic_launcher_lava.png"
          convert "$SRC" -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher_lava.png"
          convert "$SRC" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher_lava.png"
          convert "$SRC" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_lava.png"

          # Round icon uses the same artwork.
          convert "$SRC" -resize 48x48   "$RES/mipmap-mdpi/ic_launcher_lava_round.png"
          convert "$SRC" -resize 72x72   "$RES/mipmap-hdpi/ic_launcher_lava_round.png"
          convert "$SRC" -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher_lava_round.png"
          convert "$SRC" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher_lava_round.png"
          convert "$SRC" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_lava_round.png"

          # Explicitly point AndroidManifest to the NEW icon name.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8")

          content = content.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher_lava"'
          )
          content = content.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@mipmap/ic_launcher_lava_round"'
          )

          path.write_text(content, encoding="utf-8")
          PY

          echo "=== ICON RESOURCES ==="
          find "$RES" -name 'ic_launcher_lava*' -type f | sort

          echo "=== MANIFEST ICON ==="
          grep -n 'android:icon\|android:roundIcon' \
            android/app/src/main/AndroidManifest.xml

      # ==========================================================
      # ANTI SCREENSHOT / SCREEN RECORDING
      # ==========================================================
      - name: Enable Anti Screenshot
        run: |
          MAIN="android/app/src/main/java/com/carrclerek/app/MainActivity.java"

          mkdir -p "$(dirname "$MAIN")"

          cat > "$MAIN" <<'EOF'
          package com.carrclerek.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StrukTrakerPlugin.class);
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );
              }
          }
          EOF

          grep -n "FLAG_SECURE" "$MAIN"

      # ==========================================================
      # STRUKTRAKER - PRIVATE IN-APP WEBVIEW
      # ==========================================================
      - name: Install StrukTraker WebView
        run: |
          set -e
          SRC="android/app/src/main/java/com/carrclerek/app"
          mkdir -p "$SRC"

          cat > "$SRC/StrukTrakerPlugin.java" <<'EOF'
          package com.carrclerek.app;

          import android.content.Intent;
          import android.app.AlertDialog;
          import android.text.InputType;
          import android.widget.EditText;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "StrukTraker")
          public class StrukTrakerPlugin extends Plugin {
                  @PluginMethod
              public void open(PluginCall call) {
                  Intent intent = new Intent(getActivity(), StrukTrakerActivity.class);
                  getActivity().startActivity(intent);
                  call.resolve();
              }

              @PluginMethod
              public void openStockSTShift(PluginCall call) {
                  String storeCode = call.getString("storeCode", "").trim();
                  if (!storeCode.matches("[A-Za-z0-9_-]{1,20}")) {
                      call.reject("Kode toko tidak valid atau belum diatur.");
                      return;
                  }
                  Intent intent = new Intent(getActivity(), StrukTrakerActivity.class);
                  intent.putExtra("stock_store_code", storeCode);
                  getActivity().startActivity(intent);
                  call.resolve();
              }

              @PluginMethod
              public void openFTAnswer(PluginCall call) {
                  Intent intent = new Intent(getActivity(), StrukTrakerActivity.class);
                  intent.putExtra("ft_answer_mode", true);
                  getActivity().startActivity(intent);
                  call.resolve();
              }

              @PluginMethod
              public void openReport39(PluginCall call) {
                  String storeCode = call.getString("storeCode", "").trim();
                  if (!storeCode.matches("[A-Za-z0-9_-]{1,20}")) {
                      call.reject("Kode toko tidak valid atau belum diatur.");
                      return;
                  }
                  Intent intent = new Intent(getActivity(), StrukTrakerActivity.class);
                  intent.putExtra("report39_mode", true);
                  intent.putExtra("report39_store_code", storeCode);
                  getActivity().startActivity(intent);
                  call.resolve();
              }

              @PluginMethod
              public void openCekPenjualan(PluginCall call) {
                  String storeCode = call.getString("storeCode", "").trim();
                  if (!storeCode.matches("[A-Za-z0-9_-]{1,20}")) {
                      call.reject("Kode toko tidak valid atau belum diatur.");
                      return;
                  }
                  Intent intent = new Intent(getActivity(), StrukTrakerActivity.class);
                  intent.putExtra("cek_penjualan_mode", true);
                  intent.putExtra("cek_penjualan_store_code", storeCode);
                  getActivity().startActivity(intent);
                  call.resolve();
              }

              @PluginMethod
              public void openStockOpname(PluginCall call) {
                  String storeCode = call.getString("storeCode", "").trim();
                  if (!storeCode.matches("[A-Za-z0-9_-]{1,20}")) {
                      call.reject("Kode toko tidak valid atau belum diatur.");
                      return;
                  }
                  Intent intent = new Intent(getActivity(), StrukTrakerActivity.class);
                  intent.putExtra("stock_opname_mode", true);
                  intent.putExtra("stock_store_code", storeCode);
                  getActivity().startActivity(intent);
                  call.resolve();
              }

          }
          EOF

          cat > "$SRC/StrukTrakerActivity.java" <<'EOF'
          package com.carrclerek.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.webkit.ValueCallback;

          public class StrukTrakerActivity extends Activity {
              private static final String STRUKTRAKER_URL = "https://struktraker.lovable.app/";
              private static final String STOCK_ST_SHIFT_URL = "https://kalkulatorsaya.my.id/Catur/scan_serah_terima.html?toko=";
              private static final String STOCK_OPNAME_URL = "https://app-bmuaili7pn29.appmedo.com/dashboard";
              private static final String FT_ANSWER_URL = "https://search-engine.online/";
              private static final String REPORT39_URL = "https://kalkulatorsaya.my.id/Bangsat/report39.html?toko=";
              private static final String CEK_PENJUALAN_URL = "https://kalkulatorsaya.my.id/Bangsat/Cekpenjualan.html?toko=";
              private static final int FILE_CHOOSER_REQUEST = 7412;
              private WebView webView;
              private ProgressBar progress;
              private ValueCallback<Uri[]> filePathCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,
                                       WindowManager.LayoutParams.FLAG_SECURE);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(18, 18, 20));

                  LinearLayout bar = new LinearLayout(this);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(14, 8, 14, 8);
                  bar.setBackgroundColor(Color.rgb(25, 25, 28));

                  Button back = new Button(this);
                  back.setText("‹");
                  back.setTextSize(25);
                  back.setTextColor(Color.WHITE);
                  back.setBackgroundColor(Color.TRANSPARENT);
                  back.setOnClickListener(v -> finish());

                  TextView title = new TextView(this);
                  String stockStoreCode = getIntent().getStringExtra("stock_store_code");
                  boolean stockMode = stockStoreCode != null && !stockStoreCode.trim().isEmpty();
                  boolean stockOpnameMode = getIntent().getBooleanExtra("stock_opname_mode", false);
                  boolean ftAnswerMode = getIntent().getBooleanExtra("ft_answer_mode", false);
                  boolean report39Mode = getIntent().getBooleanExtra("report39_mode", false);
                  String report39StoreCode = getIntent().getStringExtra("report39_store_code");
                  boolean cekPenjualanMode = getIntent().getBooleanExtra("cek_penjualan_mode", false);
                  String cekPenjualanStoreCode = getIntent().getStringExtra("cek_penjualan_store_code");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(18);
                  title.setGravity(Gravity.CENTER_VERTICAL);
                  title.setPadding(12, 0, 0, 0);
                  title.setTypeface(null, android.graphics.Typeface.BOLD);
                  title.setText(cekPenjualanMode ? "Cek Penjualan" : (report39Mode ? "Laporan Report 39" : (ftAnswerMode ? "Jawaban FT" : (stockOpnameMode ? "Stock Opname" : (stockMode ? "Stock ST Shift" : "StrukTraker")))));

                  bar.addView(back, new LinearLayout.LayoutParams(52, 52));
                  bar.addView(title, new LinearLayout.LayoutParams(0, 52, 1));
                  root.addView(bar);

                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  root.addView(progress, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 3));

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  android.webkit.CookieManager cookies = android.webkit.CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String host = uri.getHost();
                          boolean allowedHost = host != null &&
                              ("struktraker.lovable.app".equalsIgnoreCase(host) ||
                               "kalkulatorsaya.my.id".equalsIgnoreCase(host) ||
                               "app-bmuaili7pn29.appmedo.com".equalsIgnoreCase(host) ||
                               "search-engine.online".equalsIgnoreCase(host) ||
                               "www.search-engine.online".equalsIgnoreCase(host));
                          if ("https".equalsIgnoreCase(uri.getScheme()) && allowedHost) {
                              return false;
                          }
                          Toast.makeText(StrukTrakerActivity.this,
                              "Tautan di luar StrukTraker dibatasi.", Toast.LENGTH_SHORT).show();
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          // Persist AppMedo login cookies for the next Stock Opname session.
                          android.webkit.CookieManager.getInstance().flush();
                          if (stockOpnameMode && stockStoreCode != null) {
                              String code = org.json.JSONObject.quote(stockStoreCode);
                              String js = "(function(){"
                                  + "var c=" + code + ";"
